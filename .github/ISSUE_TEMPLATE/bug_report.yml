name: Bug Report
description: File a bug report to help us improve the NFT Date Token project
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report for the NFT Date Token project!
        
  - type: checkboxes
    id: terms
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting your bug report
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have read the project README
          required: true
          
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        Please provide a clear and concise description of what the bug is.
        
        What did you expect to happen vs what actually happened?
      placeholder: Describe the bug...
    validations:
      required: true
      
  - type: dropdown
    id: component
    attributes:
      label: Which component is affected?
      description: Select the component where the bug occurs
      options:
        - Smart Contract (Date.sol)
        - Smart Contract (skinNFT.sol)
        - Frontend Application
        - Build System
        - Tests
        - Documentation
        - Other
    validations:
      required: true
      
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        Please provide step-by-step instructions to reproduce the issue.
        Include any specific dates, token IDs, or transaction details if applicable.
      placeholder: |
        1. Go to...
        2. Click on...
        3. Enter date...
        4. See error...
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what should have happened...
    validations:
      required: true
      
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: Describe what actually happened...
    validations:
      required: true
      
  - type: dropdown
    id: network
    attributes:
      label: Network
      description: Which network were you using when the bug occurred?
      options:
        - Local Development (Ganache/Hardhat)
        - Ethereum Mainnet
        - Ethereum Testnet (Rinkeby/Ropsten)
        - Other Testnet
        - Not applicable
    validations:
      required: true
      
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: |
        Please provide details about your environment:
        - Node.js version
        - npm version
        - Browser (if frontend issue)
        - Operating System
        - Truffle/Hardhat version
      placeholder: |
        Node.js: v16.x.x
        npm: v8.x.x
        Browser: Chrome v100
        OS: macOS/Windows/Linux
        Truffle: v5.x.x
      
  - type: textarea
    id: logs
    attributes:
      label: Error Logs/Screenshots
      description: |
        Please include any relevant error messages, console logs, or screenshots.
        For smart contract issues, include transaction hashes if available.
      placeholder: Paste error logs or drag and drop screenshots here...
      
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here, such as workarounds you've tried.